<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGIC — الحضور والانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a2a4a;
    --primary-2: #24365f;
    --accent: #ff8a3d;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1e2635;
    --muted: #8a93a6;
    --border: #e9edf3;
    --danger: #e0524b;
    --success: #1fa971;
    --shadow: 0 4px 18px rgba(23, 35, 66, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(125deg, var(--primary), var(--primary-2));
    color: #fff;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  #signOutBtn {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
  }
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 92vh;
    padding: 20px;
    text-align: center;
  }
  #loginScreen h2 { margin-bottom: 8px; font-size: 24px; font-weight: 800; color: var(--primary); }
  #loginScreen p { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  #googleSignInBtn {
    background: #fff;
    border: 1px solid var(--border);
    padding: 13px 26px;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  #googleSignInBtn img { width: 20px; height: 20px; }
  .error-msg { color: var(--danger); margin-top: 16px; font-size: 14px; }
  .hidden { display: none !important; }

  main { max-width: 520px; margin: 0 auto; padding: 24px 18px 40px; }

  .status-card {
    background: var(--card);
    border-radius: 18px;
    padding: 26px;
    box-shadow: var(--shadow);
    text-align: center;
    margin-bottom: 20px;
  }
  .status-card .name { font-size: 17px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
  .status-card .email { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .status-pill {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 22px;
  }
  .status-pill.in { background: #eafaf1; color: var(--success); }
  .status-pill.out { background: #fdedec; color: var(--danger); }
  .btn-row { display: flex; gap: 12px; }
  .attend-btn {
    flex: 1;
    padding: 18px 10px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    transition: 0.15s;
  }
  .attend-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .attend-btn.check-in { background: var(--success); }
  .attend-btn.check-in:hover:not(:disabled) { background: #17875f; }
  .attend-btn.check-out { background: var(--danger); }
  .attend-btn.check-out:hover:not(:disabled) { background: #c8443d; }

  .history-card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .history-card h3 { margin: 0 0 12px; font-size: 15px; color: var(--primary); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 700; }
  .row-badge { padding: 3px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 700; }
  .row-badge.in { background: #eafaf1; color: var(--success); }
  .row-badge.out { background: #fdedec; color: var(--danger); }
  .muted { color: var(--muted); font-size: 13px; }

  /* ---------- بوب أب خطوات التسجيل ---------- */
  #flowModal {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(15, 25, 45, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  #flowBox {
    width: min(420px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
  }
  #flowBox h3 { margin: 0 0 18px; font-size: 17px; color: var(--primary); }
  .flow-step {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #f4f6fa;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    text-align: right;
  }
  .flow-step .icon { font-size: 18px; flex: 0 0 auto; }
  .flow-step.active { background: #fff3ea; color: var(--accent); }
  .flow-step.done { background: #eafaf1; color: var(--success); }
  .flow-step.failed { background: #fdedec; color: var(--danger); }
  #cameraWrap { display: none; margin: 14px 0; border-radius: 14px; overflow: hidden; position: relative; background: #000; }
  #cameraWrap.active { display: block; }
  #cameraVideo { width: 100%; display: block; }
  #flowResultMsg { font-size: 13.5px; margin: 10px 0 4px; min-height: 18px; }
  #flowCancelBtn {
    margin-top: 12px;
    background: #eef2f5;
    color: var(--primary);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    width: 100%;
  }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>الحضور والانصراف</h2>
  <p>سجّل الدخول بحساب جوجل الخاص بك</p>
  <button id="googleSignInBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    تسجيل الدخول بجوجل
  </button>
  <p id="loginError" class="error-msg" style="display:none;"></p>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1>🕘 الحضور والانصراف</h1>
    <button id="signOutBtn">تسجيل الخروج</button>
  </header>
  <main>
    <div class="status-card">
      <div class="name" id="empNameLabel"></div>
      <div class="email" id="empEmailLabel"></div>
      <div class="email" id="shiftHoursLabel"></div>
      <span id="statusPill" class="status-pill out">خارج العمل</span>
      <div class="btn-row">
        <button class="attend-btn check-in" id="checkInBtn">✅ تسجيل حضور</button>
        <button class="attend-btn check-out" id="checkOutBtn">🚪 تسجيل انصراف</button>
      </div>
    </div>

    <div class="history-card">
      <h3>سجلّك اليوم</h3>
      <div id="todayHistory"><p class="muted">جاري التحميل...</p></div>
    </div>
  </main>
</div>

<div id="flowModal" class="hidden">
  <div id="flowBox">
    <h3 id="flowTitle">تسجيل الحضور</h3>
    <div class="flow-step" id="stepLocation"><span class="icon">📍</span><span>التحقق من الموقع</span></div>
    <div class="flow-step" id="stepQr"><span class="icon">📷</span><span>Scan QR Code</span></div>
    <div class="flow-step" id="stepDone"><span class="icon">✅</span><span id="stepDoneLabel">تم التسجيل بنجاح</span></div>
    <div id="cameraWrap"><video id="cameraVideo" playsinline autoplay muted></video></div>
    <canvas id="scanCanvas" class="hidden"></canvas>
    <p id="flowResultMsg" class="muted"></p>
    <button id="flowCancelBtn">إلغاء</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc, query, where, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJo6uPyjzWB0KexX9LiIx-8SGPQzrSOEg",
    authDomain: "magic-price-list.firebaseapp.com",
    projectId: "magic-price-list",
    storageBucket: "magic-price-list.firebasestorage.app",
    messagingSenderId: "950313056936",
    appId: "1:950313056936:web:a887ff76ca16094bf9e09d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginError = document.getElementById('loginError');
  const statusPill = document.getElementById('statusPill');
  const checkInBtn = document.getElementById('checkInBtn');
  const checkOutBtn = document.getElementById('checkOutBtn');
  const todayHistory = document.getElementById('todayHistory');

  const flowModal = document.getElementById('flowModal');
  const flowTitle = document.getElementById('flowTitle');
  const stepLocation = document.getElementById('stepLocation');
  const stepQr = document.getElementById('stepQr');
  const stepDone = document.getElementById('stepDone');
  const stepDoneLabel = document.getElementById('stepDoneLabel');
  const cameraWrap = document.getElementById('cameraWrap');
  const cameraVideo = document.getElementById('cameraVideo');
  const scanCanvas = document.getElementById('scanCanvas');
  const flowResultMsg = document.getElementById('flowResultMsg');
  const flowCancelBtn = document.getElementById('flowCancelBtn');

  let currentUserEmail = '';
  let currentUserName = '';
  let myRecordsUnsub = null;
  let lastAction = null; // 'in' | 'out' | null
  let companySettings = null; // { lat, lng, radiusMeters, allowMultiplePerDay }
  let qrExpectedHash = null;
  let cameraStream = null;
  let scanRafId = null;
  let flowCancelled = false;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
  }

  function showError(msg) {
    loginError.textContent = msg;
    loginError.style.display = 'block';
  }

  document.getElementById('googleSignInBtn').addEventListener('click', async () => {
    loginError.style.display = 'none';
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      showError('تعذر تسجيل الدخول. حاول مرة أخرى.');
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    if (myRecordsUnsub) myRecordsUnsub();
    await signOut(auth);
  });

  function updateStatusUI() {
    const isIn = lastAction === 'in';
    statusPill.textContent = isIn ? 'في العمل الآن' : 'خارج العمل';
    statusPill.className = 'status-pill ' + (isIn ? 'in' : 'out');
    if (companySettings && companySettings.allowMultiplePerDay) {
      checkInBtn.disabled = false;
      checkOutBtn.disabled = false;
    } else {
      checkInBtn.disabled = isIn;
      checkOutBtn.disabled = !isIn;
    }
  }

  function todayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function loadMyAttendance() {
    const q = query(collection(db, 'attendance'), where('email', '==', currentUserEmail), orderBy('timestamp', 'desc'));
    myRecordsUnsub = onSnapshot(q, snap => {
      const all = snap.docs.map(d => d.data());
      lastAction = all.length ? all[0].action : null;
      updateStatusUI();

      const today = todayKey(Date.now());
      const todays = all.filter(r => todayKey(r.timestamp) === today);
      if (!todays.length) {
        todayHistory.innerHTML = '<p class="muted">لسه معملتش تسجيل النهاردة.</p>';
        return;
      }
      let html = '<table><thead><tr><th>الحدث</th><th>الوقت</th></tr></thead><tbody>';
      todays.forEach(r => {
        const isIn = r.action === 'in';
        html += `<tr><td><span class="row-badge ${isIn ? 'in' : 'out'}">${isIn ? 'حضور' : 'انصراف'}</span></td><td>${new Date(r.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</td></tr>`;
      });
      html += '</tbody></table>';
      todayHistory.innerHTML = html;
    }, () => {
      todayHistory.innerHTML = '<p class="muted">حدث خطأ أثناء تحميل السجل.</p>';
    });
  }

  // ---------- حساب المسافة بين نقطتين (Haversine) بالمتر ----------
  function distanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function loadCompanySettings() {
    try {
      const locSnap = await getDoc(doc(db, 'settings', 'location'));
      companySettings = locSnap.exists() ? locSnap.data() : null;
    } catch (e) {
      companySettings = null;
    }
    try {
      const qrSnap = await getDoc(doc(db, 'settings', 'qrPublic'));
      qrExpectedHash = qrSnap.exists() ? qrSnap.data().secretHash : null;
    } catch (e) {
      qrExpectedHash = null;
    }
    updateStatusUI();
  }

  function setStepState(stepEl, state) {
    stepEl.classList.remove('active', 'done', 'failed');
    if (state) stepEl.classList.add(state);
  }

  function resetFlowUI(actionLabel) {
    flowTitle.textContent = actionLabel === 'in' ? 'تسجيل الحضور' : 'تسجيل الانصراف';
    stepDoneLabel.textContent = actionLabel === 'in' ? 'تم تسجيل الحضور بنجاح' : 'تم تسجيل الانصراف بنجاح';
    setStepState(stepLocation, null);
    setStepState(stepQr, null);
    setStepState(stepDone, null);
    cameraWrap.classList.remove('active');
    flowResultMsg.textContent = '';
    flowCancelBtn.textContent = 'إلغاء';
  }

  function stopCamera() {
    if (scanRafId) cancelAnimationFrame(scanRafId);
    scanRafId = null;
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    cameraWrap.classList.remove('active');
  }

  function closeFlow() {
    flowCancelled = true;
    stopCamera();
    flowModal.classList.add('hidden');
  }
  flowCancelBtn.addEventListener('click', closeFlow);

  function getLocationOnce() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('nogeo')); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  async function scanQrFromCamera() {
    cameraWrap.classList.add('active');
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    cameraVideo.srcObject = cameraStream;
    await cameraVideo.play();
    const ctx = scanCanvas.getContext('2d');

    return new Promise((resolve, reject) => {
      function tick() {
        if (flowCancelled) { reject(new Error('cancelled')); return; }
        if (cameraVideo.readyState === cameraVideo.HAVE_ENOUGH_DATA) {
          scanCanvas.width = cameraVideo.videoWidth;
          scanCanvas.height = cameraVideo.videoHeight;
          ctx.drawImage(cameraVideo, 0, 0, scanCanvas.width, scanCanvas.height);
          const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) {
            resolve(code.data);
            return;
          }
        }
        scanRafId = requestAnimationFrame(tick);
      }
      scanRafId = requestAnimationFrame(tick);
    });
  }

  async function runAttendanceFlow(action) {
    if (!companySettings || !companySettings.lat || !companySettings.lng || !companySettings.radiusMeters) {
      alert('لسه الإدارة معملتش إعدادات الموقع الجغرافي، تواصل مع المسؤول.');
      return;
    }
    if (!qrExpectedHash) {
      alert('لسه الإدارة معملتش QR Code، تواصل مع المسؤول.');
      return;
    }

    flowCancelled = false;
    resetFlowUI(action);
    flowModal.classList.remove('hidden');

    // الخطوة 1: الموقع الجغرافي
    setStepState(stepLocation, 'active');
    let coords, dist;
    try {
      coords = await getLocationOnce();
      dist = distanceMeters(coords.latitude, coords.longitude, companySettings.lat, companySettings.lng);
      if (dist > companySettings.radiusMeters) {
        setStepState(stepLocation, 'failed');
        flowResultMsg.textContent = `أنت خارج نطاق الشركة (المسافة: ${Math.round(dist)} متر). اقترب أكتر وحاول تاني.`;
        flowResultMsg.style.color = '#e0524b';
        return;
      }
      setStepState(stepLocation, 'done');
    } catch (e) {
      if (flowCancelled) return;
      setStepState(stepLocation, 'failed');
      flowResultMsg.textContent = 'تعذر الوصول لموقعك. اسمح للمتصفح بالوصول لـ GPS وحاول تاني.';
      flowResultMsg.style.color = '#e0524b';
      return;
    }

    // الخطوة 2: مسح QR
    setStepState(stepQr, 'active');
    let scannedValue;
    try {
      scannedValue = await scanQrFromCamera();
      stopCamera();
    } catch (e) {
      if (flowCancelled) return;
      setStepState(stepQr, 'failed');
      flowResultMsg.textContent = 'تعذر تشغيل الكاميرا. اسمح للمتصفح بالوصول للكاميرا وحاول تاني.';
      flowResultMsg.style.color = '#e0524b';
      return;
    }

    const scannedHash = await sha256Hex(scannedValue);
    if (scannedHash !== qrExpectedHash) {
      setStepState(stepQr, 'failed');
      flowResultMsg.textContent = 'الـ QR ده مش صحيح أو مش خاص بالشركة.';
      flowResultMsg.style.color = '#e0524b';
      return;
    }
    setStepState(stepQr, 'done');

    // الخطوة 3: تسجيل العملية في Firebase
    setStepState(stepDone, 'active');
    try {
      await addDoc(collection(db, 'attendance'), {
        email: currentUserEmail,
        name: currentUserName,
        action,
        timestamp: Date.now(),
        date: todayKey(Date.now()),
        qrValue: scannedValue,
        location: { lat: coords.latitude, lng: coords.longitude },
        distanceMeters: Math.round(dist)
      });
      setStepState(stepDone, 'done');
      flowResultMsg.textContent = '';
      flowCancelBtn.textContent = 'تم ✓';
      setTimeout(() => { if (!flowCancelled) flowModal.classList.add('hidden'); }, 1400);
    } catch (e) {
      setStepState(stepDone, 'failed');
      flowResultMsg.textContent = 'تعذر تسجيل العملية. حاول مرة أخرى.';
      flowResultMsg.style.color = '#e0524b';
    }
  }

  checkInBtn.addEventListener('click', () => runAttendanceFlow('in'));
  checkOutBtn.addEventListener('click', () => runAttendanceFlow('out'));

  onAuthStateChanged(auth, async user => {
    if (!user) {
      appScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      if (myRecordsUnsub) { myRecordsUnsub(); myRecordsUnsub = null; }
      return;
    }
    const email = user.email;
    let empSnap;
    try {
      empSnap = await getDoc(doc(db, 'employees', email));
    } catch (e) {
      showError('حدث خطأ أثناء التحقق من صلاحية حسابك.');
      await signOut(auth);
      return;
    }
    if (!empSnap.exists() || empSnap.data().active !== true || empSnap.data().role !== 'attendance') {
      showError('هذا الحساب مش مسجل كحساب "حضور وانصراف"، أو غير مفعّل. تواصل مع الإدارة.');
      await signOut(auth);
      return;
    }
    const empData = empSnap.data();
    currentUserEmail = email;
    currentUserName = empData.name || user.displayName || email;
    document.getElementById('empNameLabel').textContent = currentUserName;
    document.getElementById('empEmailLabel').textContent = email;
    if (empData.shiftStart && empData.shiftEnd) {
      document.getElementById('shiftHoursLabel').textContent = `ميعادك الرسمي: ${empData.shiftStart} — ${empData.shiftEnd}`;
    }
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    await loadCompanySettings();
    loadMyAttendance();
  });
</script>
</body>
</html>
